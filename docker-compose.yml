services:
  postgres:
    image: postgres:16-alpine
    container_name: videomax-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host port 5433 (not 5432) to avoid clashing with any other local
      # PostgreSQL instance already bound to the default port.
      - "5433:5432"
    volumes:
      - videomax-postgres-data:/var/lib/postgresql/data

volumes:
  videomax-postgres-data:
